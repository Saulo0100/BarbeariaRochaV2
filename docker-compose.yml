version: '3.8'

services:
  api:
    container_name: barbearia-api
    image: ghcr.io/saulo0100/barbeariarocha:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      # Sobrescreva com variáveis reais no host ou via .env:
      # - ConnectionStrings__DefaultConnection=...
      # - Jwt__Secret=...
      # - Email__Password=...
      # - Whatsapp__Token=...
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`barbearia-api.cloud`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks:
      - traefik-proxy

networks:
  traefik-proxy:
    external: true
